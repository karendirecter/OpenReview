[project]
name = "github-pr-auto-review"
version = "0.1.0"
description = "GitHub PR auto review MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "PyGithub>=2.4.0",
  "openai>=1.45.0",
  "python-multipart>=0.0.9",
  "jsonschema>=4.23.0",
  "unidiff>=0.7.5",
  "semgrep>=1.86.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 文档缺陷标注：PLAN.md 没有说明 pytest 配置中 pythonpath 的重要性
# 如果没有 pythonpath = ["."]，pytest 无法找到 app 模块